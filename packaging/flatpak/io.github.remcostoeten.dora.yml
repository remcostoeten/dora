id: io.github.remcostoeten.dora
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: dora
finish-args:
    - --socket=x11
    - --socket=wayland
    - --share=ipc
    - --share=network
    - --device=dri
    - --filesystem=home
    - --socket=ssh-auth
    - --talk-name=org.freedesktop.secrets
    - --env=WEBKIT_DISABLE_DMABUF_RENDERER=1

# Wraps the released .deb so the Flatpak runs the exact binary `tauri build`
# produced. A bare `cargo build` skips Tauri's custom-protocol feature and
# ships a dev build that loads http://localhost:1420.
modules:
    - name: dora
      buildsystem: simple
      sources:
          - type: file
            path: dora.deb
          - type: file
            path: io.github.remcostoeten.dora.desktop
          - type: file
            path: io.github.remcostoeten.dora.metainfo.xml
      build-commands:
          - ar -x dora.deb
          - tar -xf data.tar.*
          - install -Dm755 usr/bin/dora /app/bin/dora
          - install -Dm755 usr/bin/duckdb_helper /app/bin/duckdb_helper
          - install -Dm644 io.github.remcostoeten.dora.desktop /app/share/applications/io.github.remcostoeten.dora.desktop
          - |
              for icon in usr/share/icons/hicolor/*/apps/dora.png; do
                size="$(basename "$(dirname "$(dirname "$icon")")")"
                case "$size" in *@*) continue ;; esac
                install -Dm644 "$icon" "/app/share/icons/hicolor/${size}/apps/io.github.remcostoeten.dora.png"
              done
          - install -Dm644 io.github.remcostoeten.dora.metainfo.xml /app/share/metainfo/io.github.remcostoeten.dora.metainfo.xml
