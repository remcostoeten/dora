name: Linux repositories

# Builds the whole GitHub Pages site at https://remcostoeten.github.io/dora:
#   /         signed APT repository (amd64, arm64 when built)
#   /rpm/     signed DNF/YUM repository (x86_64, aarch64 when built)
#   /flatpak/ signed Flatpak remote, imported from the Flatpak workflow's run artifacts
# A Pages deploy replaces the whole site, so all three are rebuilt together from
# the release assets and Flatpak artifacts every time.
on:
    workflow_dispatch:
        inputs:
            tag:
                description: Existing GitHub release tag (e.g. v0.26.6). Leave empty to use latest.
                required: false
                type: string
            publish:
                description: Deploy to GitHub Pages.
                required: false
                type: boolean
                default: false
            flatpak_run_id:
                description: Run id holding the dora-flatpak-* artifacts. Leave empty to use this run.
                required: false
                type: string
    workflow_call:
        inputs:
            tag:
                description: Existing GitHub release tag (e.g. v0.26.6). Leave empty to use latest.
                required: false
                type: string
            publish:
                description: Deploy to GitHub Pages.
                required: false
                type: boolean
                default: false
            flatpak_run_id:
                description: Run id holding the dora-flatpak-* artifacts. Leave empty to use this run.
                required: false
                type: string

permissions:
    actions: read
    contents: read
    pages: write
    id-token: write

env:
    PAGES_URL: https://remcostoeten.github.io/dora
    FLATPAK_APP_ID: io.github.remcostoeten.dora

jobs:
    apt:
        runs-on: ubuntu-24.04
        environment:
            name: github-pages
            url: ${{ steps.deploy.outputs.page_url }}
        env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        steps:
            - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

            - name: Setup bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

            - name: Install repository tooling
              run: |
                  sudo apt-get update
                  sudo apt-get install -y createrepo-c flatpak ostree

            - name: Resolve release
              id: meta
              shell: bash
              run: |
                  set -euo pipefail
                  TAG="${{ inputs.tag }}"
                  if [[ -z "$TAG" ]]; then
                    TAG="$(gh api repos/${{ github.repository }}/releases/latest --jq '.tag_name')"
                  fi
                  VERSION="${TAG#v}"
                  echo "tag=$TAG" >> "$GITHUB_OUTPUT"
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"

            - name: Download Linux packages from the release
              shell: bash
              run: |
                  set -euo pipefail
                  TAG="${{ steps.meta.outputs.tag }}"
                  VERSION="${{ steps.meta.outputs.version }}"
                  REQUIRED=("Dora_${VERSION}_amd64.deb" "Dora-${VERSION}-1.x86_64.rpm")

                  for attempt in {1..60}; do
                    NAMES="$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name')"
                    MISSING=()
                    for asset in "${REQUIRED[@]}"; do
                      grep -qx "$asset" <<<"$NAMES" || MISSING+=("$asset")
                    done
                    [[ ${#MISSING[@]} -eq 0 ]] && break
                    echo "Waiting for ${MISSING[*]} on ${TAG} (${attempt}/60)..."
                    sleep 30
                  done
                  if [[ ${#MISSING[@]} -gt 0 ]]; then
                    echo "Release ${TAG} is missing ${MISSING[*]}." >&2
                    exit 1
                  fi

                  gh release download "$TAG" --repo "${{ github.repository }}" --dir assets \
                    --pattern '*.deb' --pattern '*.rpm' --pattern '*.flatpak'

                  if ! compgen -G "assets/Dora-${VERSION}-x86_64.flatpak" > /dev/null; then
                    RUN_ID="${{ inputs.flatpak_run_id }}"
                    RUN_ID="${RUN_ID:-${{ github.run_id }}}"
                    for attempt in {1..60}; do
                      rm -rf flatpak-artifacts
                      gh run download "$RUN_ID" --repo "${{ github.repository }}" --pattern 'dora-flatpak-*' --dir flatpak-artifacts 2>/dev/null || true
                      compgen -G "flatpak-artifacts/*/Dora-${VERSION}-x86_64.flatpak" > /dev/null && break
                      echo "Waiting for the x86_64 Flatpak artifact of run ${RUN_ID} (${attempt}/60)..."
                      sleep 30
                    done
                    cp flatpak-artifacts/*/Dora-"${VERSION}"-*.flatpak assets/
                  fi
                  ls -la assets

            - name: Import the signing key
              id: gpg
              shell: bash
              env:
                  GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
              run: |
                  set -euo pipefail
                  if [[ -z "${GPG_PRIVATE_KEY:-}" ]]; then
                    echo "GPG_PRIVATE_KEY is required to sign the repositories." >&2
                    exit 1
                  fi
                  GNUPGHOME="$(mktemp -d)"
                  chmod 700 "$GNUPGHOME"
                  echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
                  export GNUPGHOME
                  printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
                  KEY_ID="$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/{print $5; exit}')"
                  echo "key_id=$KEY_ID" >> "$GITHUB_OUTPUT"

            - name: Generate APT repository
              shell: bash
              env:
                  GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
              run: |
                  set -euo pipefail
                  DEB_ARGS=()
                  for deb in assets/*.deb; do DEB_ARGS+=("--deb=$deb"); done
                  bun tools/scripts/generate-apt-repo.ts "${DEB_ARGS[@]}" --out-dir=_site

            - name: Generate DNF repository
              shell: bash
              run: |
                  set -euo pipefail
                  mkdir -p _site/rpm
                  cp assets/*.rpm _site/rpm/
                  createrepo_c --general-compress-type=gz _site/rpm
                  gpg --batch --yes --armor --local-user "${{ steps.gpg.outputs.key_id }}" \
                    --detach-sign --output _site/rpm/repodata/repomd.xml.asc _site/rpm/repodata/repomd.xml
                  cat > _site/rpm/dora.repo <<REPO
                  [dora]
                  name=Dora
                  baseurl=${PAGES_URL}/rpm
                  enabled=1
                  gpgcheck=0
                  repo_gpgcheck=1
                  gpgkey=${PAGES_URL}/KEY.gpg
                  REPO

            - name: Generate Flatpak remote
              shell: bash
              run: |
                  set -euo pipefail
                  KEY_ID="${{ steps.gpg.outputs.key_id }}"
                  REPO=_site/flatpak/repo
                  mkdir -p "$REPO"
                  ostree init --mode=archive-z2 --repo="$REPO"
                  for bundle in assets/*.flatpak; do
                    flatpak build-import-bundle --gpg-sign="$KEY_ID" --gpg-homedir="$GNUPGHOME" "$REPO" "$bundle"
                  done
                  flatpak build-update-repo --generate-static-deltas --prune \
                    --title=Dora --default-branch=stable \
                    --gpg-sign="$KEY_ID" --gpg-homedir="$GNUPGHOME" "$REPO"

                  GPG_BLOCK="$(gpg --export "$KEY_ID" | base64 -w0)"
                  cat > _site/flatpak/dora.flatpakrepo <<REPO
                  [Flatpak Repo]
                  Title=Dora
                  Url=${PAGES_URL}/flatpak/repo/
                  Homepage=https://github.com/remcostoeten/dora
                  Comment=Free, open source database client
                  DefaultBranch=stable
                  GPGKey=${GPG_BLOCK}
                  REPO
                  cat > "_site/flatpak/${FLATPAK_APP_ID}.flatpakref" <<REF
                  [Flatpak Ref]
                  Title=Dora
                  Name=${FLATPAK_APP_ID}
                  Branch=stable
                  Url=${PAGES_URL}/flatpak/repo/
                  IsRuntime=false
                  SuggestRemoteName=dora
                  RuntimeRepo=https://dl.flathub.org/repo/flathub.flatpakrepo
                  GPGKey=${GPG_BLOCK}
                  REF

            - name: Write the landing page
              shell: bash
              run: |
                  cat > _site/index.html <<HTML
                  <!doctype html>
                  <meta charset="utf-8">
                  <meta name="viewport" content="width=device-width, initial-scale=1">
                  <title>Dora package repositories</title>
                  <body style="font:16px/1.6 system-ui;max-width:46rem;margin:3rem auto;padding:0 1rem">
                  <h1>Dora package repositories</h1>
                  <p>Latest: v${{ steps.meta.outputs.version }}. All repositories are signed with <a href="KEY.gpg">KEY.gpg</a>.</p>
                  <h2>Debian / Ubuntu</h2>
                  <pre>sudo install -d -m 0755 /etc/apt/keyrings
                  curl -fsSL ${PAGES_URL}/KEY.gpg | sudo gpg --dearmor -o /etc/apt/keyrings/dora.gpg
                  echo "deb [signed-by=/etc/apt/keyrings/dora.gpg] ${PAGES_URL} stable main" | sudo tee /etc/apt/sources.list.d/dora.list
                  sudo apt update && sudo apt install dora</pre>
                  <h2>Fedora / RHEL / openSUSE</h2>
                  <pre>sudo curl -fsSL -o /etc/yum.repos.d/dora.repo ${PAGES_URL}/rpm/dora.repo
                  sudo dnf install dora</pre>
                  <h2>Flatpak</h2>
                  <pre>flatpak install --user ${PAGES_URL}/flatpak/${FLATPAK_APP_ID}.flatpakref</pre>
                  <p>The ref adds Flathub for the GNOME runtime when it is missing. Updates arrive through <code>flatpak update</code>.</p>
                  <p>Other platforms: <a href="https://github.com/remcostoeten/dora#install">github.com/remcostoeten/dora</a></p>
                  </body>
                  HTML

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: _site

            - name: Deploy to GitHub Pages
              if: ${{ inputs.publish }}
              id: deploy
              uses: actions/deploy-pages@v4
