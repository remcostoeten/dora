name: Release

on:
    push:
        tags:
            - 'v*.*.*'
            - '!*-release'

concurrency:
    group: release-${{ github.ref_name }}
    cancel-in-progress: false

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
    preflight:
        permissions:
            contents: read
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

            - name: Validate release metadata
              shell: bash
              run: |
                  set -euo pipefail

                  TAG="${GITHUB_REF_NAME}"
                  TAG_VERSION="${TAG#v}"

                  if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                    echo "Release tags must be plain semver tags like v0.25.0. Got: $TAG" >&2
                    exit 1
                  fi

                  ROOT_VERSION="$(node -p "require('./package.json').version")"
                  DESKTOP_VERSION="$(node -p "require('./apps/desktop/package.json').version")"
                  TAURI_VERSION="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
                  CARGO_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' apps/desktop/src-tauri/Cargo.toml | head -1)"

                  echo "Tag version: $TAG_VERSION"
                  echo "Root package version: $ROOT_VERSION"
                  echo "Desktop package version: $DESKTOP_VERSION"
                  echo "Tauri version: $TAURI_VERSION"
                  echo "Cargo version: $CARGO_VERSION"

                  if [[ "$TAG_VERSION" != "$DESKTOP_VERSION" || "$TAG_VERSION" != "$TAURI_VERSION" || "$TAG_VERSION" != "$CARGO_VERSION" ]]; then
                    echo "Tag, desktop package, Tauri config, and Cargo versions must match before building release assets." >&2
                    exit 1
                  fi

                  if [[ "$ROOT_VERSION" != "$TAG_VERSION" ]]; then
                    echo "::warning::Root package.json is $ROOT_VERSION, release app version is $TAG_VERSION. The desktop/Tauri/Cargo versions are authoritative for Dora assets."
                  fi

                  node <<'NODE'
                  const fs = require('fs')
                  const config = require('./apps/desktop/src-tauri/tauri.conf.json')
                  const targets = new Set(config.bundle?.targets || [])
                  // `app` is what makes the macOS updater tarball (.app.tar.gz) exist: with an
                  // explicit targets list that omits it, the bundler warns "no updater-enabled
                  // targets were built" and deletes the .app, so darwin never reaches latest.json.
                  const requiredTargets = ['app', 'deb', 'rpm', 'appimage', 'nsis', 'dmg']
                  const missingTargets = requiredTargets.filter((target) => !targets.has(target))
                  if (missingTargets.length > 0) {
                    throw new Error(`Missing Tauri bundle targets: ${missingTargets.join(', ')}`)
                  }

                  if (config.bundle?.createUpdaterArtifacts !== true) {
                    throw new Error('bundle.createUpdaterArtifacts must be true to publish updater assets')
                  }

                  const requiredFiles = [
                    'packaging/aur/PKGBUILD',
                    'packaging/linux/dora.desktop',
                    'packaging/snap/snapcraft.yaml',
                    'packaging/flatpak/io.github.remcostoeten.dora.yml',
                    'packaging/flatpak/build-flatpak.sh',
                    'packaging/chocolatey/dora.nuspec',
                    'packaging/dora-packages/flake.nix',
                    'packaging/dora-packages/package.nix',
                    'tools/scripts/generate-apt-repo.ts',
                    'tools/scripts/generate-package-manifests.ts',
                    'tools/scripts/generate-homebrew-cask.ts',
                    'tools/scripts/generate-winget-manifest.ts'
                  ]
                  const missingFiles = requiredFiles.filter((file) => !fs.existsSync(file))
                  if (missingFiles.length > 0) {
                    throw new Error(`Missing distribution files: ${missingFiles.join(', ')}`)
                  }
                  NODE

    # aarch64 is best effort: when it fails the release still ships x86_64, and
    # every channel only lists the architectures that made it onto the release.
    release-linux:
        needs: preflight
        permissions:
            contents: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - arch: x86_64
                      runner: ubuntu-latest
                      checksums: checksums-linux.txt
                      optional: false
                    - arch: aarch64
                      runner: ubuntu-24.04-arm
                      checksums: checksums-linux-aarch64.txt
                      optional: true
        runs-on: ${{ matrix.runner }}
        continue-on-error: ${{ matrix.optional }}
        steps:
            - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

            - name: setup bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

            - name: install rust stable
              uses: dtolnay/rust-toolchain@stable

            - name: cache rust build
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: apps/desktop/src-tauri

            - name: install dependencies (ubuntu)
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    libgtk-3-dev \
                    libwebkit2gtk-4.1-dev \
                    libayatana-appindicator3-dev \
                    librsvg2-dev \
                    libssl-dev \
                    libsoup-3.0-dev \
                    libjavascriptcoregtk-4.1-dev \
                    patchelf \
                    xdg-utils

            - name: install frontend dependencies
              run: bun install
              working-directory: ./apps/desktop

            - name: build frontend
              run: bun run build
              working-directory: ./apps/desktop

            - uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
              with:
                  projectPath: ./apps/desktop

            - name: Build lightweight linux tarball
              run: |
                  set -euo pipefail
                  VERSION="${GITHUB_REF_NAME#v}"
                  STAGE="/tmp/dora-${{ matrix.arch }}-unknown-linux-gnu"
                  rm -rf "$STAGE"
                  mkdir -p "$STAGE/icons"

                  # Extract the dora binary from the .deb produced by tauri-action.
                  # The .deb binary is a real `tauri build` output with the Vite dist
                  # embedded into the Tauri context. A bare `cargo build --release`
                  # against this manifest produces a binary that falls back to devUrl
                  # (http://localhost:1420), which is what broke the AUR tarball.
                  DEB="$(find apps/desktop/src-tauri/target/release/bundle/deb -maxdepth 2 -name '*.deb' | head -1)"
                  if [[ -z "${DEB}" ]]; then
                    echo "Could not locate Tauri-built .deb for the linux tarball" >&2
                    exit 1
                  fi
                  echo "Extracting dora binary from ${DEB}"
                  DEB_EXTRACT="$(mktemp -d)"
                  dpkg-deb -x "${DEB}" "${DEB_EXTRACT}"
                  DEB_BIN="$(find "${DEB_EXTRACT}" -type f -name dora -path '*/bin/*' | head -1)"
                  if [[ -z "${DEB_BIN}" ]]; then
                    echo "Could not find dora binary inside ${DEB}" >&2
                    exit 1
                  fi

                  # The DuckDB engine runs out of process: without the `duckdb_helper`
                  # sidecar next to the binary, every DuckDB and data-file connection
                  # fails with "Could not connect to this database".
                  DEB_HELPER="$(find "${DEB_EXTRACT}" -type f -name duckdb_helper -path '*/bin/*' | head -1)"
                  if [[ -z "${DEB_HELPER}" ]]; then
                    echo "Could not find duckdb_helper sidecar inside ${DEB}" >&2
                    exit 1
                  fi

                  install -Dm755 "${DEB_BIN}" "$STAGE/dora"
                  install -Dm755 "${DEB_HELPER}" "$STAGE/duckdb_helper"
                  install -Dm644 packaging/linux/dora.desktop "$STAGE/dora.desktop"
                  install -Dm644 apps/desktop/src-tauri/icons/32x32.png "$STAGE/icons/32x32.png"
                  install -Dm644 apps/desktop/src-tauri/icons/128x128.png "$STAGE/icons/128x128.png"

                  TAR="dora-${{ matrix.arch }}-unknown-linux-gnu.tar.gz"
                  tar -C /tmp -czf "$TAR" "dora-${{ matrix.arch }}-unknown-linux-gnu"
                  echo "Created $TAR for version $VERSION"

            - name: generate linux checksums
              run: bun ../../tools/scripts/generate-checksums.ts --input-dir=src-tauri/target/release/bundle --output=src-tauri/target/release/bundle/${{ matrix.checksums }} --extensions=.AppImage,.deb,.rpm
              working-directory: ./apps/desktop

            - name: upload linux assets
              uses: actions/upload-artifact@v4
              with:
                  name: release-linux-${{ matrix.arch }}-assets
                  if-no-files-found: error
                  path: |
                      dora-${{ matrix.arch }}-unknown-linux-gnu.tar.gz
                      ./apps/desktop/src-tauri/target/release/bundle/deb/*.deb
                      ./apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
                      ./apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
                      ./apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage.sig
                      ./apps/desktop/src-tauri/target/release/bundle/${{ matrix.checksums }}

    release-windows:
        needs: preflight
        permissions:
            contents: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - arch: x64
                      runner: windows-2022
                      triplet: x64-windows
                      checksums: checksums-windows.txt
                      optional: false
                    - arch: arm64
                      runner: windows-11-arm
                      triplet: arm64-windows
                      checksums: checksums-windows-arm64.txt
                      optional: true
        runs-on: ${{ matrix.runner }}
        continue-on-error: ${{ matrix.optional }}
        steps:
            - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

            - name: setup bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

            - name: install rust stable
              uses: dtolnay/rust-toolchain@stable

            - name: cache rust build
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: apps/desktop/src-tauri

            # ring's C build cannot find the ARM64 MSVC headers unless the developer environment is loaded.
            - name: load the MSVC arm64 environment
              if: matrix.arch == 'arm64'
              uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
              with:
                  arch: arm64

            # The VS 2026 STL still defines _SECURE_SCL but dropped stdext::checked_array_iterator,
            # which DuckDB's bundled fmt uses whenever _SECURE_SCL is defined.
            - name: hide _SECURE_SCL from DuckDB's bundled fmt
              if: matrix.arch == 'arm64'
              shell: pwsh
              run: |
                  $Shim = Join-Path $env:RUNNER_TEMP 'no-secure-scl.h'
                  Set-Content -Path $Shim -Value "#pragma once`n#include <yvals.h>`n#undef _SECURE_SCL"
                  echo "CXXFLAGS_aarch64_pc_windows_msvc=/FI$Shim" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

            - name: install sqlite3 via vcpkg
              shell: pwsh
              run: |
                  $VcpkgRoot = "C:\vcpkg"
                  $Triplet = "${{ matrix.triplet }}"
                  # Not every runner image ships vcpkg (windows-11-arm did not at the time of writing).
                  if (-not (Test-Path "$VcpkgRoot\vcpkg.exe")) {
                    git clone --depth 1 https://github.com/microsoft/vcpkg $VcpkgRoot
                    & "$VcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
                  }
                  & "$VcpkgRoot\vcpkg.exe" install "sqlite3:$Triplet"
                  $VcpkgLib = "$VcpkgRoot\installed\$Triplet\lib"
                  $VcpkgInclude = "$VcpkgRoot\installed\$Triplet\include"
                  $VcpkgBin = "$VcpkgRoot\installed\$Triplet\bin"
                  echo "VCPKG_ROOT=$VcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
                  echo "VCPKGRS_TRIPLET=$Triplet" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
                  echo "LIB=$VcpkgLib;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
                  echo "INCLUDE=$VcpkgInclude;$env:INCLUDE" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
                  echo "PATH=$VcpkgBin;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

            - name: install frontend dependencies
              run: bun install
              working-directory: ./apps/desktop

            - name: build frontend
              run: bun run build
              working-directory: ./apps/desktop

            - uses: tauri-apps/tauri-action@v0
              env:
                  VCPKG_ROOT: ${{ env.VCPKG_ROOT }}
                  VCPKGRS_TRIPLET: ${{ env.VCPKGRS_TRIPLET }}
                  LIB: ${{ env.LIB }}
                  INCLUDE: ${{ env.INCLUDE }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
              with:
                  projectPath: ./apps/desktop

            - name: generate windows checksums
              run: bun ../../tools/scripts/generate-checksums.ts --input-dir=src-tauri/target/release/bundle --output=src-tauri/target/release/bundle/${{ matrix.checksums }} --extensions=.exe
              working-directory: ./apps/desktop

            - name: upload windows assets
              uses: actions/upload-artifact@v4
              with:
                  name: release-windows-${{ matrix.arch }}-assets
                  if-no-files-found: error
                  path: |
                      ./apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
                      ./apps/desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
                      ./apps/desktop/src-tauri/target/release/bundle/${{ matrix.checksums }}

    release-macos:
        needs: preflight
        permissions:
            contents: write
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

            - name: setup bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

            - name: install rust stable
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: aarch64-apple-darwin,x86_64-apple-darwin

            - name: cache rust build
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: apps/desktop/src-tauri

            - name: install frontend dependencies
              run: bun install
              working-directory: ./apps/desktop

            - name: build frontend
              run: bun run build
              working-directory: ./apps/desktop

            - name: stage Apple signing and notarization credentials
              shell: bash
              env:
                  APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
                  APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
                  APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
                  APPLE_ID: ${{ secrets.APPLE_ID }}
                  APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
                  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
              run: |
                  set -euo pipefail
                  if [ -z "$APPLE_CERTIFICATE" ]; then
                    echo "::warning::APPLE_CERTIFICATE is not set; the macOS bundle will ship unsigned and Gatekeeper will block it on first launch"
                    exit 0
                  fi
                  for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
                    if [ -z "${!name}" ]; then
                      echo "$name must be set alongside APPLE_CERTIFICATE" >&2
                      exit 1
                    fi
                    {
                      echo "$name<<DORA_SECRET_EOF"
                      echo "${!name}"
                      echo "DORA_SECRET_EOF"
                    } >> "$GITHUB_ENV"
                  done
                  echo "MACOS_SIGNING=1" >> "$GITHUB_ENV"

            - uses: tauri-apps/tauri-action@v0
              env:
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
              with:
                  projectPath: ./apps/desktop
                  args: --target universal-apple-darwin

            - name: verify macOS signature and notarization
              if: env.MACOS_SIGNING == '1'
              shell: bash
              run: |
                  set -euo pipefail
                  APP="$(find ./apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)"
                  if [ -z "$APP" ]; then
                    echo "No .app bundle found to verify" >&2
                    exit 1
                  fi
                  codesign --verify --deep --strict --verbose=2 "$APP"
                  spctl --assess --type execute --verbose=2 "$APP"
                  xcrun stapler validate "$APP"

            - name: verify macOS updater artifacts exist
              shell: bash
              run: |
                  set -euo pipefail
                  BUNDLE=./apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle
                  for pattern in "$BUNDLE/dmg"/*.dmg "$BUNDLE/macos"/*.app.tar.gz "$BUNDLE/macos"/*.app.tar.gz.sig; do
                    if ! compgen -G "$pattern" >/dev/null; then
                      echo "Missing macOS release artifact matching $pattern" >&2
                      find "$BUNDLE" -maxdepth 2 -mindepth 1 >&2 || true
                      exit 1
                    fi
                  done

            - name: upload macOS assets
              uses: actions/upload-artifact@v4
              with:
                  name: release-macos-assets
                  if-no-files-found: error
                  path: |
                      ./apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
                      ./apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
                      ./apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig

    publish-release:
        needs: [release-linux, release-windows, release-macos]
        # The arm64 matrix legs may fail without blocking; the asset gate below
        # decides whether the required x86_64 and macOS files are all present.
        if: ${{ !cancelled() && needs.release-macos.result == 'success' }}
        permissions:
            contents: write
            actions: read
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
              with:
                  fetch-depth: 0

            - name: setup bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

            - name: Install git-cliff
              uses: taiki-e/install-action@git-cliff

            - name: Publish release with all assets
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail

                  VERSION="${{ github.ref_name }}"

                  mkdir -p /tmp/release-assets
                  gh run download "${{ github.run_id }}" -D /tmp/release-assets

                  mapfile -t ASSETS < <(find /tmp/release-assets -type f | sort)
                  if [ "${#ASSETS[@]}" -lt 11 ]; then
                    echo "Expected at least 11 release assets, found ${#ASSETS[@]}" >&2
                    find /tmp/release-assets -type f || true
                    exit 1
                  fi

                  # Every updater channel needs its signed artifact here or latest.json
                  # silently ships without that platform (see #223 for the macOS case).
                  REQUIRED_PATTERNS=(
                    '_x64-setup\.exe$'
                    '_x64-setup\.exe\.sig$'
                    '_amd64\.AppImage$'
                    '_amd64\.AppImage\.sig$'
                    '_amd64\.deb$'
                    '\.x86_64\.rpm$'
                    '/dora-x86_64-unknown-linux-gnu\.tar\.gz$'
                    '/checksums-linux\.txt$'
                    '/checksums-windows\.txt$'
                    '_universal\.dmg$'
                    '\.app\.tar\.gz$'
                    '\.app\.tar\.gz\.sig$'
                  )
                  MISSING=()
                  for pattern in "${REQUIRED_PATTERNS[@]}"; do
                    if ! printf '%s\n' "${ASSETS[@]}" | grep -q "$pattern"; then
                      MISSING+=("$pattern")
                    fi
                  done
                  if [ "${#MISSING[@]}" -gt 0 ]; then
                    echo "Missing required release assets matching: ${MISSING[*]}" >&2
                    printf '%s\n' "${ASSETS[@]}" >&2
                    exit 1
                  fi

                  echo "=== Release assets (${#ASSETS[@]}) ==="
                  printf '%s\n' "${ASSETS[@]}"

                  if gh release view "$VERSION" >/dev/null 2>&1; then
                    ASSET_COUNT="$(gh release view "$VERSION" --json assets --jq '.assets | length')"
                    if [ "$ASSET_COUNT" -eq 0 ]; then
                      echo "Deleting empty pre-created release $VERSION"
                      gh release delete "$VERSION" --yes
                    else
                      echo "Release $VERSION already exists with $ASSET_COUNT assets; refusing to overwrite." >&2
                      exit 1
                    fi
                  fi

                  RELEASE_NOTES=".github/release-notes/${VERSION}.md"
                  NOTES_FILE="/tmp/release-notes.md"
                  if [ -f "$RELEASE_NOTES" ]; then
                    echo "Using curated release notes from $RELEASE_NOTES"
                    cp "$RELEASE_NOTES" "$NOTES_FILE"
                  else
                    mapfile -t TAGS < <(git tag --list 'v*' --sort=-version:refname)
                    PREV_TAG="$(printf '%s\n' "${TAGS[@]}" | grep -A1 "^${VERSION}$" | tail -1)"
                    if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "$VERSION" ]; then
                      echo "Could not resolve previous tag for ${VERSION}" >&2
                      exit 1
                    fi
                    echo "Generating release notes with git-cliff (${PREV_TAG}..${VERSION})"
                    git-cliff "${PREV_TAG}..${VERSION}" > "$NOTES_FILE"
                  fi

                  # Build the Tauri updater manifest from the signed (.sig) artifacts so
                  # installed apps can auto-update from this release.
                  bun tools/scripts/generate-latest-json.ts \
                    --assets-dir=/tmp/release-assets \
                    --version="$VERSION" \
                    --notes-file="$NOTES_FILE" \
                    --repo="${{ github.repository }}" \
                    --output=/tmp/latest.json
                  ASSETS+=("/tmp/latest.json")

                  gh release create "$VERSION" \
                    --title "Dora ${VERSION}" \
                    --notes-file "$NOTES_FILE" \
                    "${ASSETS[@]}"

    post-release:
        needs: publish-release
        if: ${{ !cancelled() && needs.publish-release.result == 'success' }}
        permissions:
            contents: write
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
              with:
                  ref: master
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Update README after release
              run: |
                  set -euo pipefail

                  VERSION="${{ github.ref_name }}"
                  VERSION_NUM="${VERSION#v}"

                  sed -i "s/<version>/${VERSION_NUM}/g" README.md
                  sed -i -E "s/VERSION=\"[0-9]+\.[0-9]+\.[0-9]+\"/VERSION=\"${VERSION_NUM}\"/g" README.md
                  sed -i -E "s/Dora-[0-9]+\.[0-9]+\.[0-9]+-x86_64/Dora-${VERSION_NUM}-x86_64/g" README.md

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add README.md
                  git diff --cached --quiet && echo "Nothing to commit" && exit 0
                  git commit -m "chore(release): update README for ${VERSION}"
                  git push origin master

    # Each channel runs as a reusable-workflow job so its real outcome shows up
    # in this run: a failed AUR push or Winget manifest turns the release run
    # red instead of vanishing into a detached fire-and-forget dispatch.
    # The explicit `if` keeps a failed optional arm64 build from skipping them.
    publish-aur:
        needs: publish-release
        if: ${{ !cancelled() && needs.publish-release.result == 'success' }}
        permissions:
            contents: write
        uses: ./.github/workflows/aur.yml
        with:
            tag: ${{ github.ref_name }}
        secrets: inherit

    publish-homebrew:
        needs: publish-release
        if: ${{ !cancelled() && needs.publish-release.result == 'success' }}
        permissions:
            contents: write
        uses: ./.github/workflows/brew.yml
        with:
            tag: ${{ github.ref_name }}
            publish: true
        secrets: inherit

    # Needs the Flatpak bundles, so a failed Flatpak build leaves the live Pages
    # site untouched instead of deploying it without the Flatpak remote.
    publish-apt:
        needs: [publish-release, build-flatpak]
        if: ${{ !cancelled() && needs.publish-release.result == 'success' && needs.build-flatpak.result == 'success' }}
        permissions:
            contents: read
            pages: write
            id-token: write
        uses: ./.github/workflows/apt.yml
        with:
            tag: ${{ github.ref_name }}
            publish: true
        secrets: inherit

    publish-winget:
        needs: publish-release
        if: ${{ !cancelled() && needs.publish-release.result == 'success' }}
        permissions:
            contents: write
        uses: ./.github/workflows/winget.yml
        with:
            tag: ${{ github.ref_name }}
            submit_update: true
        secrets: inherit

    publish-snap:
        needs: publish-release
        if: ${{ !cancelled() && needs.publish-release.result == 'success' }}
        permissions:
            contents: write
        uses: ./.github/workflows/snap.yml
        with:
            tag: ${{ github.ref_name }}
            publish: true
            release_channel: stable
        secrets: inherit

    build-flatpak:
        needs: publish-release
        if: ${{ !cancelled() && needs.publish-release.result == 'success' }}
        permissions:
            contents: write
        uses: ./.github/workflows/flatpak.yml
        with:
            tag: ${{ github.ref_name }}
        secrets: inherit

    publish-packages:
        needs: publish-release
        if: ${{ !cancelled() && needs.publish-release.result == 'success' }}
        permissions:
            contents: read
        uses: ./.github/workflows/packages.yml
        with:
            tag: ${{ github.ref_name }}
            publish: true
        secrets: inherit

    publish-chocolatey:
        needs: publish-release
        if: ${{ !cancelled() && needs.publish-release.result == 'success' }}
        permissions:
            contents: read
        uses: ./.github/workflows/chocolatey.yml
        with:
            tag: ${{ github.ref_name }}
            publish: true
        secrets: inherit
