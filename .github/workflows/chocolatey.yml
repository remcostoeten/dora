name: Chocolatey

# Packs packaging/chocolatey around the released x64 NSIS installer, test-installs
# and uninstalls it, and pushes it to community.chocolatey.org when
# CHOCOLATEY_API_KEY is set. Without the key it stops after the test install.
on:
    workflow_dispatch:
        inputs:
            tag:
                description: Existing GitHub release tag like v0.26.6. Leave empty for the latest release.
                required: false
                type: string
            publish:
                description: Push the package to community.chocolatey.org.
                required: false
                type: boolean
                default: false
    workflow_call:
        inputs:
            tag:
                description: Existing GitHub release tag like v0.26.6. Leave empty for the latest release.
                required: false
                type: string
            publish:
                description: Push the package to community.chocolatey.org.
                required: false
                type: boolean
                default: false

    pull_request:
        paths:
            - packaging/chocolatey/**
            - .github/workflows/chocolatey.yml

permissions:
    contents: read

jobs:
    chocolatey:
        runs-on: windows-2022
        env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        steps:
            - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

            - name: Resolve release and installer
              id: meta
              shell: bash
              run: |
                  set -euo pipefail
                  TAG="${{ inputs.tag }}"
                  if [[ -z "$TAG" ]]; then
                    TAG="$(gh api repos/${{ github.repository }}/releases/latest --jq '.tag_name')"
                  fi
                  VERSION="${TAG#v}"
                  ASSET="Dora_${VERSION}_x64-setup.exe"

                  for attempt in {1..60}; do
                    if gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' | grep -qx "$ASSET"; then
                      break
                    fi
                    echo "Waiting for ${ASSET} on ${TAG} (${attempt}/60)..."
                    sleep 30
                  done

                  gh release download "$TAG" --repo "${{ github.repository }}" --pattern "$ASSET" --dir dist
                  SHA256="$(sha256sum "dist/$ASSET" | awk '{print $1}')"
                  {
                    echo "tag=$TAG"
                    echo "version=$VERSION"
                    echo "url=https://github.com/${{ github.repository }}/releases/download/${TAG}/${ASSET}"
                    echo "sha256=$SHA256"
                  } >> "$GITHUB_OUTPUT"

            - name: Render package
              shell: bash
              run: |
                  set -euo pipefail
                  mkdir -p build
                  cp -r packaging/chocolatey/. build/
                  sed -i "s|@VERSION@|${{ steps.meta.outputs.version }}|g" build/dora.nuspec
                  sed -i -e "s|@URL64@|${{ steps.meta.outputs.url }}|" -e "s|@SHA256@|${{ steps.meta.outputs.sha256 }}|" \
                    build/tools/chocolateyinstall.ps1

            - name: Pack
              working-directory: build
              shell: pwsh
              run: choco pack dora.nuspec --outputdirectory ..\out

            - name: Test install and uninstall
              shell: pwsh
              run: |
                  choco install dora --source "'$PWD\out;https://community.chocolatey.org/api/v2/'" --version "${{ steps.meta.outputs.version }}" -y --no-progress
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  choco uninstall dora -y --no-progress
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            - name: Upload package artifact
              uses: actions/upload-artifact@v4
              with:
                  name: chocolatey-${{ steps.meta.outputs.version }}
                  path: out/*.nupkg

            - name: Push to community.chocolatey.org
              if: ${{ env.CHOCOLATEY_API_KEY != '' && inputs.publish }}
              shell: pwsh
              run: |
                  choco push "out\dora.${{ steps.meta.outputs.version }}.nupkg" --source https://push.chocolatey.org/ --api-key "$env:CHOCOLATEY_API_KEY"
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            - name: Chocolatey key not configured
              if: ${{ env.CHOCOLATEY_API_KEY == '' }}
              shell: bash
              run: echo "::warning::CHOCOLATEY_API_KEY is not configured; the package was built and tested but not pushed."
