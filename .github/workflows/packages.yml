name: Scoop and Nix

# Rewrites remcostoeten/dora-packages, which is both a Scoop bucket
# (bucket/dora.json) and a Nix flake (flake.nix + release.json). The static
# files come from packaging/dora-packages; the manifests are generated from the
# release assets. Both are tested before anything is pushed: Scoop installs the
# manifest on Windows and Nix builds the flake.
on:
    workflow_dispatch:
        inputs:
            tag:
                description: Existing GitHub release tag like v0.26.6. Leave empty for the latest release.
                required: false
                type: string
            publish:
                description: Push to remcostoeten/dora-packages.
                required: false
                type: boolean
                default: false
    workflow_call:
        inputs:
            tag:
                description: Existing GitHub release tag like v0.26.6. Leave empty for the latest release.
                required: false
                type: string
            publish:
                description: Push to remcostoeten/dora-packages.
                required: false
                type: boolean
                default: false

    pull_request:
        paths:
            - packaging/dora-packages/**
            - tools/scripts/generate-package-manifests.ts
            - .github/workflows/packages.yml

permissions:
    contents: read

jobs:
    generate:
        runs-on: ubuntu-latest
        outputs:
            tag: ${{ steps.meta.outputs.tag }}
            version: ${{ steps.meta.outputs.version }}
        env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        steps:
            - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

            - name: Setup bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

            - name: Resolve release and download assets
              id: meta
              shell: bash
              run: |
                  set -euo pipefail
                  TAG="${{ inputs.tag }}"
                  if [[ -z "$TAG" ]]; then
                    TAG="$(gh api repos/${{ github.repository }}/releases/latest --jq '.tag_name')"
                  fi
                  VERSION="${TAG#v}"
                  REQUIRED=("Dora_${VERSION}_amd64.deb" "Dora_${VERSION}_x64-setup.exe")

                  for attempt in {1..60}; do
                    NAMES="$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name')"
                    MISSING=()
                    for asset in "${REQUIRED[@]}"; do
                      grep -qx "$asset" <<<"$NAMES" || MISSING+=("$asset")
                    done
                    [[ ${#MISSING[@]} -eq 0 ]] && break
                    echo "Waiting for ${MISSING[*]} on ${TAG} (${attempt}/60)..."
                    sleep 30
                  done
                  if [[ ${#MISSING[@]} -gt 0 ]]; then
                    echo "Release ${TAG} is missing ${MISSING[*]}." >&2
                    exit 1
                  fi

                  gh release download "$TAG" --repo "${{ github.repository }}" --dir assets \
                    --pattern '*.deb' --pattern '*-setup.exe'
                  echo "tag=$TAG" >> "$GITHUB_OUTPUT"
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"

            - name: Generate manifests
              shell: bash
              run: |
                  set -euo pipefail
                  mkdir -p site
                  cp -r packaging/dora-packages/. site/
                  bun tools/scripts/generate-package-manifests.ts \
                    --version=${{ steps.meta.outputs.version }} \
                    --tag=${{ steps.meta.outputs.tag }} \
                    --assets-dir=assets \
                    --out-dir=site

            - uses: actions/upload-artifact@v4
              with:
                  name: dora-packages
                  path: site
                  if-no-files-found: error

    nix:
        needs: generate
        runs-on: ubuntu-latest
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: dora-packages
                  path: site

            - uses: cachix/install-nix-action@v31
              with:
                  extra_nix_config: experimental-features = nix-command flakes

            - name: Build the flake
              working-directory: site
              run: |
                  set -euo pipefail
                  git init -q && git add -A
                  nix flake lock
                  nix build .#dora --print-build-logs
                  test -x result/bin/dora
                  test -x result/bin/duckdb_helper
                  cp flake.lock /tmp/flake.lock

            - uses: actions/upload-artifact@v4
              with:
                  name: dora-packages-flake-lock
                  path: /tmp/flake.lock

    scoop:
        needs: generate
        runs-on: windows-2022
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: dora-packages
                  path: site

            - name: Install Scoop
              shell: pwsh
              run: |
                  Invoke-Expression "& {$(Invoke-RestMethod get.scoop.sh)} -RunAsAdmin"
                  Join-Path (Resolve-Path ~).Path 'scoop\shims' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

            - name: Install Dora from the generated manifest
              shell: pwsh
              run: |
                  scoop install .\site\bucket\dora.json
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  $dir = scoop prefix dora
                  foreach ($file in 'dora.exe', 'duckdb_helper.exe') {
                    if (-not (Test-Path (Join-Path $dir $file))) { throw "$file is missing from $dir" }
                  }
                  scoop uninstall dora

    publish:
        needs: [generate, nix, scoop]
        runs-on: ubuntu-latest
        env:
            PACKAGES_DEPLOY_KEY: ${{ secrets.PACKAGES_DEPLOY_KEY }}
        steps:
            - name: Deploy key not configured
              if: ${{ env.PACKAGES_DEPLOY_KEY == '' }}
              run: echo "::warning::PACKAGES_DEPLOY_KEY is not configured; the Scoop and Nix manifests were tested but not pushed."

            - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
              if: ${{ env.PACKAGES_DEPLOY_KEY != '' && inputs.publish }}
              with:
                  repository: remcostoeten/dora-packages
                  path: remote
                  ssh-key: ${{ secrets.PACKAGES_DEPLOY_KEY }}

            - uses: actions/download-artifact@v4
              if: ${{ env.PACKAGES_DEPLOY_KEY != '' && inputs.publish }}
              with:
                  name: dora-packages
                  path: site

            - uses: actions/download-artifact@v4
              if: ${{ env.PACKAGES_DEPLOY_KEY != '' && inputs.publish }}
              with:
                  name: dora-packages-flake-lock
                  path: lock

            - name: Push to remcostoeten/dora-packages
              if: ${{ env.PACKAGES_DEPLOY_KEY != '' && inputs.publish }}
              shell: bash
              run: |
                  set -euo pipefail
                  find remote -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
                  cp -r site/. remote/
                  cp lock/flake.lock remote/flake.lock
                  cd remote
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add -A
                  if git diff --cached --quiet; then
                    echo "dora-packages is already up to date."
                    exit 0
                  fi
                  git commit -m "dora ${{ needs.generate.outputs.version }}"
                  git push
